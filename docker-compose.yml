services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: quiz_local
      POSTGRES_USER: quiz_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local password in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz_local -d quiz_local']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
